[project]
name = "surt"
version = "0.3.1"
description = "Sort-friendly URI Reordering Transform (SURT) python package."
authors = [
    { name = "rajbot", email = "raj@archive.org" }
]
license = "AGPL-3.0-or-later"
readme = "README.md"
dependencies = [
  "six",
  "tldextract>=2.0"
]
requires-python = ">= 3.3"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
